# Safe build tuning shared by clean clones and CI. Never add credentials here.
# Release credentials belong in user-level ~/.gradle/gradle.properties or
# environment variables so they cannot be staged from this repository.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
