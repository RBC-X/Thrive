# Gradle build tuning (committed so CI and clean clones build reliably).
# Local machines may override these in their own (gitignored) gradle.properties.
# Release keystore credentials intentionally live only in the local
# gitignored gradle.properties — never commit them.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
